routing:
  strategy: "cheapest"  # Options: cheapest, fallback
  classifier:
    tier1_threshold: 0.35   # Score < 0.35 -> Tier 1 (simple)
    tier2_threshold: 0.70   # Score 0.35-0.70 -> Tier 2 (medium), > 0.70 -> Tier 3 (complex)
  fallback_enabled: true    # Allow fallback to adjacent tiers if no model available

telemetry:
  db_path: "./data/aion.db"
  batch_size: 100
  flush_interval: "5s"
